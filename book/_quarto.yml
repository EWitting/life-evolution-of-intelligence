project:
  type: book
  output-dir: _book
  resources:
    - "data/*.json"
    - "js/*.js"
    - "dashboards/*.html"
    - "media/*.mp4"
    - "media/*.jpg"

book:
  title: "Evolving a brain, stage by stage"
  author: "Emiel Witting"
  chapters:
    - index.qmd
    - background.qmd
    - roadmap.qmd
    - part: "Chapter 1: steering"
      chapters:
        - 1-0-steering.qmd
        - 1-1-valence.qmd
        - habituation.qmd
        - 1-5-association.qmd
        - drives.qmd
        - affect.qmd
        - pallium.qmd
    - part: "Chapter 2: reinforcing"
      chapters:
        - critic.qmd
        - actor.qmd

format:
  html:
    theme:
      light: cosmo
      dark: darkly
    css: life-book.css
    toc: true
    number-sections: false
    include-after-body:
      text: |
        <script src="js/life-book.js"></script>
