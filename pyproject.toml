[project]
name = "life"
version = "0.1.0"
description = "Evolving, learning rate-coded brains in an OHOL-style 2D world (JAX)."
requires-python = ">=3.12"
dependencies = [
    "jax>=0.6",
    "numpy>=1.26",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pillow>=10"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["life*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
