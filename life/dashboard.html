<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Life dashboard</title>
<style>
  :root { --bg:#f6f6f4; --panel:#fff; --ink:#222; --muted:#777; --line:#ddd; --accent:#c8102e; }
  body { margin:0; font:13px/1.4 system-ui, sans-serif; background:var(--bg); color:var(--ink); }
  header { display:flex; flex-wrap:wrap; gap:12px; align-items:center; padding:8px 14px; background:var(--panel); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:2; }
  header h1 { font-size:15px; margin:0 12px 0 0; }
  header input[type=range] { width:320px; }
  button, select { font:inherit; padding:2px 8px; }
  main { display:grid; grid-template-columns: minmax(420px, 640px) 1fr; gap:12px; padding:12px; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:8px 10px; }
  .panel h2 { font-size:13px; margin:0 0 6px; color:var(--muted); font-weight:600; text-transform:uppercase; letter-spacing:.04em; }
  #world { image-rendering:pixelated; cursor:crosshair; display:block; max-width:100%; }
  #tip { position:fixed; pointer-events:none; background:#222; color:#fff; padding:4px 8px; border-radius:4px; font-size:12px; display:none; z-index:5; white-space:pre; }
  .right { display:flex; flex-direction:column; gap:12px; }
  .row { display:flex; gap:16px; flex-wrap:wrap; align-items:flex-start; }
  .kv { display:grid; grid-template-columns:auto auto; gap:2px 10px; }
  .kv b { color:var(--muted); font-weight:500; }
  .bar { height:8px; background:#eee; border-radius:4px; width:120px; display:inline-block; vertical-align:middle; }
  .bar i { display:block; height:100%; border-radius:4px; background:#4a8; }
  canvas.heat { display:block; max-width:100%; image-rendering:pixelated; }
  canvas.zoomed { cursor:grab; } canvas.zoomed:active { cursor:grabbing; }
  #legend { color:var(--muted); font-size:12px; }
  details { font-size:12px; } pre { max-height:300px; overflow:auto; background:#fafafa; padding:6px; }
  #archSvg { display:block; user-select:none; touch-action:none; }
  #archSvg .reg { cursor:move; } #archSvg .edge { cursor:pointer; }
  #archSvg text { font:12px system-ui, sans-serif; fill:var(--ink); }
  #archSvg text.sub { font-size:10px; fill:var(--muted); }
  #archSvg text.elab { paint-order:stroke; stroke:#fff; stroke-width:3px; }
  .small { color:var(--muted); font-size:12px; }
  #archDetail a, #archLegend a, #noBrain a { color:#1b3a6b; }
</style>
</head>
<body>
<header>
  <h1 id="title">Life</h1>
  <button id="play">Play</button>
  <button id="back">&lt;</button><button id="fwd">&gt;</button>
  <input type="range" id="tick" min="0" value="0">
  <span id="tickLabel"></span>
  <label>speed <select id="speed"><option value="1">1x</option><option value="2">2x</option><option value="5">5x</option><option value="10">10x</option><option value="25" selected>25x</option><option value="50">50x</option><option value="100">100x</option><option value="250">250x</option></select></label>
  <label>agent <select id="agent"></select></label>
  <label><input type="checkbox" id="useSprites" checked> sprites</label>
  <span id="legend"></span>
</header>
<main>
  <div class="panel">
    <h2>World <span id="worldInfo" style="text-transform:none;font-weight:400"></span></h2>
    <canvas id="world"></canvas>
    <div id="legendObjects" style="margin-top:6px"></div>
  </div>
  <div class="right">
    <div class="panel small" id="noBrain" style="display:none"></div>
    <div class="panel">
      <h2>Architecture <span id="archInfo" style="text-transform:none;font-weight:400"></span></h2>
      <svg id="archSvg" width="100%"></svg>
      <div id="archLegend" class="small"></div>
      <div id="archDetail" style="margin-top:8px"></div>
    </div>
    <div class="panel">
      <h2>Agent <span id="agentTitle" style="text-transform:none;font-weight:400"></span></h2>
      <div class="row">
        <div class="kv" id="agentKv"></div>
        <div><div style="color:var(--muted)">retina (colour = appearance, height = closeness, A = agent, | = wall)</div>
          <canvas id="retina" class="heat" width="360" height="70"></canvas>
          <div style="color:var(--muted)">body inputs</div><div id="body"></div></div>
      </div>
    </div>
    <div class="panel">
      <h2>Activations over time (rows = neurons by region, blue -1 .. red +1) <span id="actRange" style="text-transform:none;font-weight:400"></span></h2>
      <canvas id="act" class="heat"></canvas>
      <div id="actLegend" style="color:var(--muted);font-size:12px"></div>
    </div>
    <div class="panel">
      <h2>Weights <select id="wmode"><option value="w">w at nearest snapshot</option><option value="dw">w - w0 (lifetime change)</option><option value="w0">w0 (genome)</option><option value="eta">learning rate eta</option></select>
        <span id="wInfo" style="text-transform:none;font-weight:400"></span></h2>
      <div class="row"><canvas id="wmat" class="heat"></canvas><div id="wRegions" style="font-size:12px;color:var(--muted)"></div></div>
    </div>
    <div class="panel">
      <h2>Fitness over generations (mean, max, net food eaten)</h2>
      <canvas id="fit" class="heat" width="700" height="160"></canvas>
    </div>
    <div class="panel"><details><summary>Config</summary><pre id="config"></pre></details></div>
  </div>
</main>
<div id="tip"></div>
<script>
const DATA = /*__DATA__*/null;
const M = DATA.meta;
const T = M.T, N = M.N, H = M.H, W = M.W, L = M.layout;
const NN = L.n, NIN = L.n_in;
function decode(d) {
  const bin = atob(d.data); const buf = new ArrayBuffer(bin.length); const u8 = new Uint8Array(buf);
  for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
  const C = {int8: Int8Array, uint8: Uint8Array, int16: Int16Array, int32: Int32Array, float32: Float32Array}[d.dtype];
  return {a: new C(buf), shape: d.shape};
}
// light export (dashboard.py, light=True): the grid is stored as its first tick plus the cells that change per tick
function expandGrid() {
  const n = decode(DATA.grid_n).a, ci = decode(DATA.grid_i).a, cv = decode(DATA.grid_v).a, a = new Int16Array(T * H * W), S = H * W;
  a.set(decode(DATA.grid0).a);
  for (let tt = 1, k = 0; tt < T; tt++) { a.copyWithin(tt * S, (tt - 1) * S, tt * S); for (const e = k + n[tt]; k < e; k++) a[tt * S + ci[k]] = cv[k]; }
  return {a, shape: [T, H, W]};
}
const grid = DATA.grid ? decode(DATA.grid) : expandGrid(), pos = decode(DATA.pos), dir = decode(DATA.dir), alive = decode(DATA.alive);
const held = decode(DATA.held), food = decode(DATA.food), pain = decode(DATA.pain), action = decode(DATA.action);
const mod = decode(DATA.mod), X = decode(DATA.x), WS = decode(DATA.w_snap), W0 = decode(DATA.w0), ETA = decode(DATA.eta);
const SNAPS = WS.shape[0];
// light export: activations and weights are stored for the agents in M.brain_agents only. BI[agent] = its row in
// those arrays, -1 = no brain view; NBR = rows per tick. A full export stores every agent (BI[i] = i).
const BA = M.brain_agents || null, NBR = BA ? BA.length : N;
const BI = Array.from({length: N}, (_, i) => BA ? BA.indexOf(i) : i);
const brainRow = () => BI[focus] >= 0 ? BI[focus] : BI[M.best];   // weights shown when the focused agent has none
const NMOD = mod.shape[2] || 1, MODN = (L.mod_names && L.mod_names.length) ? L.mod_names : ['modulator'];
const sprites = {};
for (const [oid, url] of Object.entries(DATA.sprites)) { const im = new Image(); im.src = url; sprites[oid] = im; }
const ground = DATA.ground ? new Image() : null; let groundPat = null;   // OHOL grassland, tiled like the game: one texture per 4x4 cells
if (ground) ground.src = DATA.ground;
const people = (DATA.people || []).map(url => { const im = new Image(); im.src = url; return im; });   // OHOL bodies, facing right
const objColour = M.colours.map(c => `rgb(${c.map(v => Math.round(v * 255)).join(',')})`);
function appColour(v) { return `rgb(${[0,1,2].map(i => Math.round(255 * (0.5 + 0.45 * (v[i] || 0)))).join(',')})`; }

let t = 0, focus = M.best, playing = false;
const $ = id => document.getElementById(id);
$('title').textContent = `${M.experiment} / ${M.run}`;
$('tick').max = T - 1;
for (let i = 0; i < N; i++) { const o = document.createElement('option'); o.value = i; o.textContent = i + (i === M.best ? ' (best)' : '') + (BA && BI[i] >= 0 ? ' · brain view' : ''); $('agent').appendChild(o); }
$('agent').value = focus;
$('config').textContent = JSON.stringify(M.config, null, 1);
$('legendObjects').innerHTML = M.names.map((n, i) => i ? `<span style="display:inline-block;margin:0 8px 2px 0"><i style="display:inline-block;width:10px;height:10px;background:${objColour[i]};border:1px solid #999;vertical-align:middle"></i> ${n}${M.food_value[i] ? ' (food ' + M.food_value[i] + ')' : ''}</span>` : '').join('');

// ---------- zoom / pan: wheel zooms at the cursor, drag pans, double-click resets ----------
// Content coords are canvas pixels at zoom 1 (the whole plot); canvas = (content - o) * s. The view never leaves the content.
function zoomable(cv, axis, redraw, max = 16) {
  const z = {sx: 1, sy: 1, ox: 0, oy: 0, dragged: false};
  const clamp = () => {
    z.sx = Math.max(1, Math.min(max, z.sx)); z.sy = Math.max(1, Math.min(max, z.sy));
    z.ox = Math.max(0, Math.min(cv.width - cv.width / z.sx, z.ox)); z.oy = Math.max(0, Math.min(cv.height - cv.height / z.sy, z.oy));
    cv.classList.toggle('zoomed', z.sx > 1 || z.sy > 1);
  };
  z.clamp = clamp;
  // keep content point (x, y) out of the outer `m` fraction of the view by shifting the view as little as possible
  z.follow = (x, y, m = 0.2) => {
    const vw = cv.width / z.sx, vh = cv.height / z.sy;
    z.ox = Math.min(Math.max(z.ox, x - vw * (1 - m)), x - vw * m); z.oy = Math.min(Math.max(z.oy, y - vh * (1 - m)), y - vh * m); clamp();
  };
  const toCanvas = e => { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) * cv.width / r.width, (e.clientY - r.top) * cv.height / r.height]; };
  z.toContent = e => { const [cx, cy] = toCanvas(e); return [z.ox + cx / z.sx, z.oy + cy / z.sy]; };
  z.x = x => (x - z.ox) * z.sx; z.y = y => (y - z.oy) * z.sy;   // content -> canvas
  z.apply = ctx => ctx.setTransform(z.sx, 0, 0, z.sy, -z.ox * z.sx, -z.oy * z.sy);
  cv.addEventListener('wheel', e => {
    e.preventDefault();
    const [cx, cy] = toCanvas(e), [x, y] = z.toContent(e), f = Math.exp(-(e.deltaY || e.deltaX) * 0.0015), ax = axis(e);
    if (ax.includes('x')) z.sx *= f; if (ax.includes('y')) z.sy *= f; clamp();
    z.ox = x - cx / z.sx; z.oy = y - cy / z.sy; clamp(); redraw();
  }, {passive: false});
  let drag = null;
  cv.addEventListener('mousedown', e => { drag = toCanvas(e); z.dragged = false; });
  window.addEventListener('mousemove', e => {
    if (!drag) return; const [cx, cy] = toCanvas(e);
    if (Math.abs(cx - drag[0]) + Math.abs(cy - drag[1]) > 3) z.dragged = true;
    if (!z.dragged) return;
    z.ox -= (cx - drag[0]) / z.sx; z.oy -= (cy - drag[1]) / z.sy; drag = [cx, cy]; clamp(); redraw();
  });
  window.addEventListener('mouseup', () => { drag = null; });
  cv.addEventListener('dblclick', () => { z.sx = z.sy = 1; z.ox = z.oy = 0; clamp(); redraw(); });
  return z;
}

// ---------- world ----------
const wc = $('world'), wctx = wc.getContext('2d');
const CELL = Math.max(8, Math.floor(Math.min(620 / W, 620 / H)));
wc.width = W * CELL; wc.height = H * CELL;
const zw = zoomable(wc, () => 'xy', () => drawWorld());
function drawWorld() {
  const g = grid.a, base = t * H * W, useS = $('useSprites').checked;
  zw.apply(wctx);
  if (useS && ground && ground.complete && ground.naturalWidth && !groundPat) {
    groundPat = wctx.createPattern(ground, 'repeat'); const k = 4 * CELL / ground.naturalWidth;
    if (groundPat.setTransform) groundPat.setTransform(new DOMMatrix([k, 0, 0, k, 0, 0]));
  }
  wctx.fillStyle = useS && groundPat ? groundPat : '#e9e3d2'; wctx.fillRect(0, 0, wc.width, wc.height);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const o = g[base + y * W + x]; if (!o) continue;
    const im = useS ? sprites[String(M.ohol_id[o])] : null;
    if (im && im.complete && im.naturalWidth) {
      const s = CELL * 0.95, r = Math.min(s / im.naturalWidth, s / im.naturalHeight);
      const dw = im.naturalWidth * r, dh = im.naturalHeight * r;
      wctx.fillStyle = 'rgba(0,0,0,0.18)'; wctx.beginPath(); wctx.ellipse(x * CELL + CELL / 2, y * CELL + CELL - 2, dw * 0.42, CELL * 0.1, 0, 0, 7); wctx.fill();
      wctx.drawImage(im, x * CELL + (CELL - dw) / 2, y * CELL + CELL - dh - 1, dw, dh);
    } else { wctx.fillStyle = objColour[o]; wctx.fillRect(x * CELL + 1, y * CELL + 1, CELL - 2, CELL - 2); }
  }
  const pb = t * N * 2;
  for (let i = 0; i < N; i++) {
    const y = pos.a[pb + 2 * i], x = pos.a[pb + 2 * i + 1], d = dir.a[t * N + i], al = alive.a[t * N + i];
    const cx = x * CELL + CELL / 2, cy = y * CELL + CELL / 2, r = CELL * 0.38, col = al ? (i === focus ? '#c8102e' : '#1b3a6b') : '#bbb';
    const body = useS && people.length ? people[i % people.length] : null;
    wctx.save(); wctx.translate(cx, cy);
    if (body && body.complete && body.naturalWidth) {
      // OHOL bodies only face left/right: flip for left, keep the last horizontal facing while moving up/down
      let left = d === 3; if (d % 2 === 0) for (let tt = t - 1; tt >= Math.max(0, t - 200); tt--) { const dd = dir.a[tt * N + i]; if (dd % 2) { left = dd === 3; break; } }
      const s = CELL * 1.05 / body.naturalHeight, bw = body.naturalWidth * s, bh = body.naturalHeight * s;
      wctx.globalAlpha = al ? 1 : 0.35;
      wctx.fillStyle = 'rgba(0,0,0,0.18)'; wctx.beginPath(); wctx.ellipse(0, CELL / 2 - 2, bw * 0.5, CELL * 0.1, 0, 0, 7); wctx.fill();
      if (left) wctx.scale(-1, 1);
      wctx.drawImage(body, -bw / 2, CELL / 2 - bh - 1, bw, bh);
      // held item in front of the hand, roughly where OHOL puts it (heldOffset: right of and below the body centre); mirrors with the body
      const h = held.a[t * N + i];
      if (h) {
        const him = useS ? sprites[String(M.ohol_id[h])] : null, hs = CELL * 0.45, hx = bw * 0.3, hy = CELL / 2 - bh * 0.42;
        if (him && him.complete && him.naturalWidth) {
          const k = hs / Math.max(him.naturalWidth, him.naturalHeight), iw = him.naturalWidth * k, ih = him.naturalHeight * k;
          wctx.drawImage(him, hx - iw / 2, hy - ih / 2, iw, ih);
        } else { wctx.fillStyle = objColour[h]; wctx.fillRect(hx - hs / 4, hy - hs / 4, hs / 2, hs / 2); }
      }
      if (left) wctx.scale(-1, 1);
      // facing chevron at the cell edge
      const a = Math.max(3, CELL * 0.2);
      wctx.rotate(d * Math.PI / 2); wctx.beginPath(); wctx.moveTo(0, -CELL / 2 - a * 0.4); wctx.lineTo(a, -CELL / 2 + a * 0.6); wctx.lineTo(-a, -CELL / 2 + a * 0.6); wctx.closePath();
      wctx.fillStyle = col; wctx.fill(); wctx.strokeStyle = 'rgba(255,255,255,0.9)'; wctx.lineWidth = 1; wctx.stroke();
    } else {
      wctx.rotate(d * Math.PI / 2);
      wctx.beginPath(); wctx.moveTo(0, -r); wctx.lineTo(r * 0.8, r); wctx.lineTo(-r * 0.8, r); wctx.closePath();
      wctx.fillStyle = col; wctx.fill();
      wctx.strokeStyle = 'rgba(255,255,255,0.8)'; wctx.lineWidth = 1; wctx.stroke();
      const h = held.a[t * N + i];   // held item: a square in its legend colour inside the triangle
      if (h) { wctx.fillStyle = objColour[h]; wctx.fillRect(-r * 0.3, r * 0.1, r * 0.6, r * 0.6); wctx.strokeRect(-r * 0.3, r * 0.1, r * 0.6, r * 0.6); }
    }
    wctx.restore();
    if (i === focus) { wctx.strokeStyle = '#c8102e'; wctx.lineWidth = 2; wctx.beginPath(); wctx.arc(cx, cy, CELL * 0.6, 0, 7); wctx.stroke(); }
    else if (BA && BI[i] >= 0 && al) { wctx.strokeStyle = '#1b3a6b'; wctx.lineWidth = 1; wctx.beginPath(); wctx.arc(cx, cy, CELL * 0.6, 0, 7); wctx.stroke(); }
  }
  wctx.setTransform(1, 0, 0, 1, 0, 0);
  let na = 0; for (let i = 0; i < N; i++) na += alive.a[t * N + i];
  $('worldInfo').textContent = `tick ${t}, alive ${na}/${N}`;
}
function worldCell(e) { const [cx, cy] = zw.toContent(e); return [Math.floor(cx / CELL), Math.floor(cy / CELL)]; }
wc.addEventListener('click', e => {
  if (zw.dragged) return;
  const [x, y] = worldCell(e);
  const pb = t * N * 2;
  for (let i = 0; i < N; i++) if (pos.a[pb + 2 * i] === y && pos.a[pb + 2 * i + 1] === x) { setFocus(i); return; }
});
wc.addEventListener('mousemove', e => {
  const [x, y] = worldCell(e);
  if (x < 0 || y < 0 || x >= W || y >= H) return hideTip();
  const o = grid.a[t * H * W + y * W + x]; const ags = [];
  const pb = t * N * 2; for (let i = 0; i < N; i++) if (pos.a[pb + 2 * i] === y && pos.a[pb + 2 * i + 1] === x) ags.push(i);
  showTip(e, `(${y},${x}) ${o ? M.names[o] : 'empty'}${ags.length ? '\nagents: ' + ags.join(', ') : ''}`);
});
wc.addEventListener('mouseleave', hideTip);
function showTip(e, s) { const tp = $('tip'); tp.style.display = 'block'; tp.textContent = s; tp.style.left = (e.clientX + 12) + 'px'; tp.style.top = (e.clientY + 12) + 'px'; }
function hideTip() { $('tip').style.display = 'none'; }

// ---------- agent panel ----------
const V = M.vision, FV = 4 + V.appearance_dim, NV = V.columns * FV, NB = NIN - NV - 1;
const INN = L.in_names || [];
function xval(tt, i, j) { const b = BI[i]; return b < 0 ? 0 : X.a[(tt * NBR + b) * NN + j] / 127; }
function drawAgent() {
  const i = focus, f = food.a[t * N + i], p = pain.a[t * N + i], h = held.a[t * N + i];
  $('agentTitle').textContent = `#${i} ${alive.a[t * N + i] ? 'alive' : 'dead'}`;
  const nb = $('noBrain'); nb.style.display = BI[i] < 0 ? 'block' : 'none';
  if (BI[i] < 0) nb.innerHTML = `This light export stores the brain (activations, weights) of ${BA.length} of the ${N} agents. Agent #${i} is not one of them: its retina, inputs and activations below are empty, and the weights are those of agent #${M.best}. Agents with a brain view (ringed in the world): ` + BA.map(a => `<a href="#" data-a="${a}">#${a}</a>`).join(' ');
  const kv = [['food', `<span class="bar"><i style="width:${Math.max(0, 100 * f / M.world.max_food)}%"></i></span> ${f.toFixed(1)}`],
    ['pain', p.toFixed(2)], ['held', h ? M.names[h] : '-'], ['action', M.actions[action.a[t * N + i]]],
    ...MODN.map((nm, k) => ['mod ' + nm, mod.a[(t * N + i) * NMOD + k].toFixed(2)]), ['pos', `(${pos.a[(t * N + i) * 2]}, ${pos.a[(t * N + i) * 2 + 1]}) facing ${['up', 'right', 'down', 'left'][dir.a[t * N + i]]}`]];
  $('agentKv').innerHTML = kv.map(([k, v]) => `<b>${k}</b><span>${v}</span>`).join('');
  const rc = $('retina'), ctx = rc.getContext('2d'); ctx.clearRect(0, 0, rc.width, rc.height);
  const cw = rc.width / V.columns;
  for (let c = 0; c < V.columns; c++) {
    const b = c * FV, hit = xval(t, i, b), close = xval(t, i, b + 1), isA = xval(t, i, b + 2), isW = xval(t, i, b + 3);
    const app = [0, 1, 2].map(k => xval(t, i, b + 4 + k));
    ctx.fillStyle = '#eee'; ctx.fillRect(c * cw + 1, 0, cw - 2, rc.height - 14);
    if (hit > 0.5) { const hh = Math.max(3, close * (rc.height - 14)); ctx.fillStyle = isW > 0.5 ? '#555' : appColour(app); ctx.fillRect(c * cw + 1, rc.height - 14 - hh, cw - 2, hh); }
    ctx.fillStyle = '#333'; ctx.font = '11px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(isA > 0.5 ? 'A' : isW > 0.5 ? '|' : '', c * cw + cw / 2, rc.height - 3);
  }
  const bn = INN.length ? INN.slice(NV, NV + NB) : ['food', 'age', 'pain', 'held?'].concat(Array.from({length: V.appearance_dim}, (_, k) => 'held app ' + k));
  $('body').innerHTML = bn.map((n, k) => `<span style="display:inline-block;margin-right:10px"><b style="color:#777;font-weight:500">${n}</b> ${xval(t, i, NV + k).toFixed(2)}</span>`).join('') + `<span><b style="color:#777;font-weight:500">sound</b> ${xval(t, i, NV + NB).toFixed(2)}</span>`;
}

// ---------- activations ----------
const ac = $('act'), actx = ac.getContext('2d');
const RH = NN > 200 ? 1 : 2, TW = Math.max(1, Math.floor(700 / T));
ac.width = T * TW; ac.height = NN * RH;
const actOff = document.createElement('canvas'); actOff.width = T; actOff.height = NN;   // one pixel per (tick, neuron)
const zact = zoomable(ac, e => e.shiftKey ? 'y' : 'x', () => drawAct(), 64);
let actFocus = -1;
function heat(v) { v = Math.max(-1, Math.min(1, v)); return v < 0 ? [255 * (1 + v), 255 * (1 + v), 255] : [255, 255 * (1 - v), 255 * (1 - v)]; }
function buildAct() {
  const octx = actOff.getContext('2d'), img = octx.createImageData(T, NN), d = img.data;

function updateArchActivity() {

}
function projLine(i, link = true) {
  const p = PROJ[i], s = AR.stats[i], name = p.label;

}
let detKey = '', detImg = null;
function selectArch(sel) { AR.sel = sel; detKey = ''; renderArch(); renderArchDetail(); drawArchDetail(); }
function renderArchDetail() {
  const el = $('archDetail'), sel = AR.sel;
  if (!sel) { el.innerHTML = '<span class="small">Click a block for its activations over time and its projections, or an arrow for its weight block.</span>'; return; }
  const idx = f => PROJ.map((p, i) => f(p) ? i : -1).filter(i => i >= 0);
  if (sel.type === 'region') {
    const r = regOf(sel.name), a = r.spec.alpha, ins = idx(p => p.dst === r.name), outs = idx(p => p.src === r.name);
    el.innerHTML = `<div><b>${r.name}</b> <span class="small">${r.size} neurons (${r.off}-${r.off + r.size - 1})${a !== undefined && r.name !== 'in' ? `, alpha ${a} (time constant ~${(1 / a).toFixed(1)} steps)` : ''}${r.spec.trace_tau !== undefined ? `, trace_tau ${r.spec.trace_tau}` : ''}</span> <a href="#" id="archZoom">zoom the activation plot to this region</a></div>`
      + `<div class="small" style="margin-top:4px">activations over time (rows = neurons, click = go to tick)</div><canvas id="archAct" class="heat" style="width:100%"></canvas>`
      + `<div style="margin-top:4px"><span class="small">inputs</span><br>${ins.map(i => projLine(i)).join('<br>') || '<span class="small">none</span>'}</div>`

    el.innerHTML = `<div>${projLine(sel.i, false)}</div><div class="small" style="margin:4px 0">rows = pre (${a.name}${p.rows.length < a.size ? ', selected features' : ''}), columns = post (${b.name}) <select id="archMode">${opt.map(([v, n]) => `<option value="${v}"${v === AR.mode ? ' selected' : ''}>${n}</option>`).join('')}</select></div><canvas id="archW" class="heat"></canvas>`;

}
function drawArchDetail() {
  const sel = AR.sel; if (!sel) return;

    const cv = $('archAct'); if (!cv) return;

    if (key !== detKey) {

function drawArch() { if (updateStats()) { renderArch(); if (AR.sel) { renderArchDetail(); detKey = ''; } } else updateArchActivity(); drawArchDetail(); }
function svgPt(e) { const m = svg.getScreenCTM().inverse(); return [e.clientX * m.a + e.clientY * m.c + m.e, e.clientX * m.b + e.clientY * m.d + m.f]; }
function archTip(e) {
  const c = e.target.closest('.cell');
  if (c) {
    const lo = +c.dataset.lo, hi = +c.dataset.hi; let s = 0; for (let j = lo; j < hi; j++) s += xval(t, focus, j);
    return showTip(e, (hi - lo > 1 ? `${neuronName(lo)} .. ${neuronName(hi - 1)} (mean)` : neuronName(lo)) + ` = ${(s / (hi - lo)).toFixed(2)}`);
  }
  const ed = e.target.closest('.edge');
  if (ed) { const i = +ed.dataset.p, p = PROJ[i], s = AR.stats[i]; return showTip(e, `${p.label}${p.kind === 'gain' ? ' (gain)' : ''}\nrule ${p.rule}${p.modulator || p.modulated ? ', modulated by ' + (p.modulator || MODN[0]) : ''}\n${s.n} synapses, mean |w| ${s.mean.toFixed(2)}\ninput per ${p.dst} neuron (sum |w| / size) ${s.drive.toFixed(2)}${s.plastic ? `\n${(100 * s.plastic).toFixed(0)}% plastic, mean |w - w0| ${s.dmean.toFixed(3)}` : ''}\nclick for the weight block`); }
  const mn = e.target.closest('.modnode');
  if (mn) {
    const m = MODS.find(q => q.name === mn.dataset.m), k = MODN.indexOf(m.name);
    const rec = REG.filter(r => r.receptors.some(rc => rc[0] === m.name)).map(r => { const rc = r.receptors.find(q => q[0] === m.name); return `${r.name} (${rc[1]} x${rc[2]})`; });
    const gated = PROJ.filter(p => p.modulator === m.name).map(p => p.label);
    const expr = [m.pos ? '+' + m.pos : '', m.neg ? '−' + m.neg : '', ...(m.terms || []).map(t => (t[1] >= 0 ? '+' : '−') + Math.abs(t[1]) + '·' + t[0])].filter(Boolean).join(' ');
    return showTip(e, `modulator ${m.name} = ${m.scale}·(${expr} − ${m.baseline})   (region means)\nnow ${k >= 0 ? mod.a[(t * N + focus) * NMOD + k].toFixed(3) : '?'}\nreceptors: ${rec.join(', ') || 'none'}\ngates plasticity of: ${gated.join(', ') || 'none'}`);
  }

  if (g) { const r = regOf(g.dataset.r); return showTip(e, `${r.group ? r.group + ' / ' : ''}${r.name}: ${r.size} neurons${r.receptors.length ? '\nreceptors: ' + r.receptors.map(q => `${q[0]} ${q[1]} x${q[2]}`).join(', ') : ''}${r.spec.alpha !== undefined && r.name !== 'in' ? `, alpha ${r.spec.alpha}` : ''}\nclick for details, drag to move`); }

}
svg.addEventListener('pointerdown', e => {
  const g = e.target.closest('.reg'); if (!g) return;
  AR.drag = {name: g.dataset.r, start: svgPt(e), orig: AR.pos[g.dataset.r].slice(), moved: false};
  svg.setPointerCapture(e.pointerId); hideTip();
});
svg.addEventListener('pointermove', e => {
  const dr = AR.drag; if (!dr) return archTip(e);
  const [x, y] = svgPt(e), dx = x - dr.start[0], dy = y - dr.start[1];
  if (Math.abs(dx) + Math.abs(dy) > 3) dr.moved = true;
  if (dr.moved) { AR.pos[dr.name] = [Math.max(BW / 2, Math.min(SVGW - BW / 2, dr.orig[0] + dx)), Math.max(BH / 2 + 36, dr.orig[1] + dy)]; renderArch(); }

$('archDetail').addEventListener('click', e => {

$('archDetail').addEventListener('mouseleave', hideTip);
$('archInfo').textContent = `${REG.length} regions, ${PROJ.length} projections, ${NN} neurons, modulators: ${MODN.join(', ')}${M.brain.projections ? '' : ' (projections inferred from weights)'}`;
$('archLegend').innerHTML = Object.entries(RULE_COL).filter(([r]) => r !== '?').map(([r, c]) => `<span style="margin-right:10px"><i style="display:inline-block;width:18px;height:3px;background:${c};vertical-align:middle"></i> ${RULE_LABEL[r] || r}</span>`).join('')
  + ` dashed = plasticity gated by a modulator (×name), dotted = gain (multiplicative) projection. Green blocks = excitatory, red = inhibitory (Dale's law). Modulators: ${(M.brain.modulators || []).map(m => `<b>${m.name}</b> = ${m.source === 'region' ? `${m.scale}·(${m.pos}${m.neg ? ' − ' + m.neg : ''} − ${m.baseline})` : m.source}`).join(', ') || (M.brain.modulator || 'none')}. Line width = summed |w| per target neuron at the current snapshot. Cells = the focused agent's activations at this tick. Drag blocks to arrange (remembered in this browser), <a href="#" id="archReset">reset layout</a>.`;
$('archReset').addEventListener('click', e => { e.preventDefault(); try { localStorage.removeItem(LSKEY); } catch (err) {} autoLayout(); renderArch(); });
autoLayout(); loadPos(); updateStats(); renderArch(); renderArchDetail();

// ---------- control ----------
// follow = keep the focused agent (world) and the current tick (activations) inside zoomed views; used by playback and stepping
function setTick(v, follow = false) {
  t = Math.max(0, Math.min(T - 1, v));
  if (follow) { zw.follow((pos.a[(t * N + focus) * 2 + 1] + 0.5) * CELL, (pos.a[(t * N + focus) * 2] + 0.5) * CELL); zact.follow((t + 0.5) * TW, zact.oy + ac.height / zact.sy / 2); } $('tick').value = t; $('tickLabel').textContent = `${t} / ${T - 1} (${fmtTime(t / TPS)})`; drawWorld(); drawAgent(); drawAct(); drawW(); drawArch();
}
function fmtTime(sec) { const m = Math.floor(sec / 60), s = Math.floor(sec % 60); return `${m}:${String(s).padStart(2, '0')}`; }
function setFocus(i) { focus = i; $('agent').value = i; setTick(t, true); }
$('tick').addEventListener('input', e => setTick(+e.target.value));
$('agent').addEventListener('change', e => setFocus(+e.target.value));

$('speed').title = `1x = real time (${TPS} tick${TPS === 1 ? '' : 's'} per second)`;

$('play').addEventListener('click', () => { playing = !playing; $('play').textContent = playing ? 'Pause' : 'Play'; if (playing) { if (t >= T - 1) setTick(0); lastFrame = 0; tickAcc = 0; requestAnimationFrame(loop); } });
function loop(now) {
